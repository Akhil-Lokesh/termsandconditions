name: Eval Regression Gate

# Triggers whenever a PR touches the LLM detector, the prompts, or the eval
# datasets. Anywhere else and we don't bother burning a Claude key.
on:
  pull_request:
    paths:
      - "backend/app/core/llm_clause_detector.py"
      - "backend/app/prompts/**"
      - "backend/evals/datasets/**"
      - "backend/evals/metrics/**"
      - "backend/evals/baseline_runner.py"
      - "backend/evals/ci_gate.py"

jobs:
  kappa-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The brief is explicit: if there's no ANTHROPIC_API_KEY secret in the
      # repo, this job MUST skip cleanly (exit 0, no red X). Forks won't have
      # the secret, and we don't want the gate to be a blocker for them.
      - name: Skip when no API key available
        if: ${{ secrets.ANTHROPIC_API_KEY == '' }}
        run: |
          echo "ANTHROPIC_API_KEY not configured for this run — skipping eval gate."
          echo "This is expected for forks / draft PRs. The full gate runs on internal PRs."
          exit 0

      - name: Run baseline on 100 samples
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_HUB_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python -m evals.baseline_runner \
            --dataset all \
            --n 100 \
            --out /tmp/eval-current.json
          test -f /tmp/eval-current.json || {
            echo "current results file not produced — exiting 0 (skip)";
            exit 0;
          }

      - name: Run CI regression gate
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          HF_HUB_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          if [ ! -f evals/baseline.json ]; then
            echo "evals/baseline.json not committed yet — skipping gate (pass)."
            exit 0
          fi
          python -m evals.ci_gate \
            --current /tmp/eval-current.json \
            --baseline evals/baseline.json \
            --max-regression 0.03

      - name: Upload eval artifacts
        if: ${{ always() && secrets.ANTHROPIC_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            /tmp/eval-current.json
            backend/evals/judge/judge_disagreements.jsonl
          if-no-files-found: ignore
          retention-days: 14
